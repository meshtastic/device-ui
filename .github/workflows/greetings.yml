name: Greetings

on: [pull_request_target, issues]

permissions: read-all

jobs:
  greeting:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: Congratulations for your first issue
          pr_message: Congratulations for your first pull request
