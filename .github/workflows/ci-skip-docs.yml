name: CI Pipeline
concurrency:
  group: ci-docs-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on:
  pull_request:
    branches:
      - master
    paths:
      - '**.md'
      - docs/**

permissions: read-all

jobs:
  # Mirrors the build-and-test job in ci.yml so the required status check
  # still reports for PRs ci.yml skips via paths-ignore (docs-only changes).
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docs-only change, skipping build-and-test."
